document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ty:1;transform:translateY(0);}}\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background:{{ c.bg }};color:{{ c.ink }};min-height:100vh;font-family:'Archivo',sans-serif;transition:background 0.3s ease,color 0.3s ease;\">\n\n  <nav style=\"position:sticky;top:0;z-index:50;background:{{ c.bg }};border-bottom:2px solid currentColor;padding:18px clamp(16px,4vw,40px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;transition:background 0.3s ease;\">\n    <button sc-camel-on-click=\"{{ toHome }}\" style=\"background:none;border:none;padding:0;cursor:pointer;font-family:'Archivo Black',sans-serif;font-size:20px;letter-spacing:-0.02em;text-transform:uppercase;color:inherit;\">DESIGN AGENCY<\u002Fbutton>\n    <sc-if value=\"{{ isDesktopNav }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;\">\n        <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ item.onClick }}\" style=\"{{ item.style }}\">{{ item.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap;\">\n        <div style=\"display:flex;border:2px solid currentColor;\">\n          <sc-for list=\"{{ modeItems }}\" as=\"seg\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ seg.onClick }}\" style=\"{{ seg.style }}\">{{ seg.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toContact }}\" style=\"background:{{ c.ink }};color:{{ c.bg }};border:none;padding:10px 20px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;\" style-hover=\"background:#D8FF3E;color:#111111;\">Start a project<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isMobileNav }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ toggleMenu }}\ lay:inline-block;background:{{ c.ink }};color:{{ c.bg }};padding:4px 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;\">(02) Services<\u002Fspan>\n      <h2 style=\"font-family:'Archivo Black',sans-serif;font-size:clamp(32px,5vw,56px);margin:16px 0 0 0;\">What we do<\u002Fh2>\n      <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;gap:40px;padding:40px 0;border-bottom:1px solid {{ c.border }};flex-wrap:wrap;\">\n          <div style=\"{{ numRowStyle }}\">\n            <span style=\"font-family:'Archivo Black',sans-serif;font-size:56px;color:{{ c.border }};width:100px;flex-shrink:0;\">{{ s.num }}<\u002Fspan>\n            <div style=\"font-size:26px;font-weight:800;\">{{ s.title }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:260px;\">\n            <p style=\"font-size:16px;color:{{ c.muted }};margin:0;max-width:560px;\">{{ s.desc }}<\u002Fp>\n            <div style=\"margin-top:20px;display:flex;flex-wrap:wrap;gap:10px 24px;\">\n              <sc-for list=\"{{ s.bullets }}\" as=\"b\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;\">\n                  <span>—<\u002Fspan><span>{{ b }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <section style=\"border-top:2px solid currentColor;padding:clamp(56px,10vw,100px) clamp(16px,4vw,40px);\">\n      <span style=\"display:inline-block;background:{{ c.ink }};color:{{ c.bg }};padding:4px 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;\">(03) How we work<\u002Fspan>\n      <h2 style=\"font-family:'Archivo Black',sans-serif;font-size:clamp(32px,5vw,56px);margin:16px 0 0 0;\">Our approach<\u002Fh2>\n      <sc-for list=\"{{ principles }}\" as=\"pr\" hin .meta }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:{{ c.invBg }};color:{{ c.invText }};padding:clamp(56px,10vw,100px) clamp(16px,4vw,40px);\">\n      <h2 style=\"font-family:'Archivo Black',sans-serif;font-size:clamp(32px,6vw,64px);margin:0;\">Have a project in mind?<\u002Fh2>\n      <p style=\"margin-top:16px;font-size:18px;color:{{ c.invMuted }};\">Let's talk about what you're building.<\u002Fp>\n      <button sc-camel-on-click=\"{{ toContact }}\" style=\"margin-top:32px;background:#D8FF3E;color:#111111;padding:14px 28px;border:none;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;\" style-hover=\"opacity:0.8;\">Start a project<\u002Fbutton>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isWork }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"padding:clamp(80px,16vw,140px) clamp(16px,4vw,40px) clamp(32px,6vw,60px);border-bottom:2px solid currentColor;\">\n      <span style=\"display:inline-block;background:{{ c.ink }};color:{{ c.bg }};padding:4px 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;\">(Work)<\u002Fspan>\n      <h1 style=\"font-family:'Archivo Black',sans-serif;font-size:clamp(40px,7vw,88px);margin:16px 0 0 0;\">Selected Work<\u002Fh1>\n      <p style=\"max-width:620px;font-size:19px;color:{{ c.muted }};margin-top:24px;\">A few of the products and brands we've helped build.<\u002Fp>\n    <\u002Fsection>\n    <section style=\"padding:clamp(48px,10vw,80px) clamp(16px,4vw,40px) clamp(72px,14vw,140px);\">\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-bottom:48px;\">\n        <sc-for list=\"{{ categoryItems }}\" as=\"cat\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ cat.onClick }}\" style=\"{{ cat.style }}\">{{ cat.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px;\">\n        <sc-for list=\"{{ workProjects }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div>\n            <div style=\"width:100%;aspect-ratio:4/3;border:2px solid currentColor;overflow:hidden;\">\n              <image-slot id=\"proj-{{ p.id }}\" placeholder=\"{{ p.title }}\" shape=\"rect\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div style=\"margin-top:16px;font-weight:800;font-size:20px;\">{{ p.title }}<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:13px;text-transform:uppercase;letter-spacing:0.06em;color:{{ c.muted2 }};\">{{ p.meta }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"padding:clamp(80px,16vw,140px) clamp(16px,4vw,40px) clamp(32px,6vw,60px);border-bottom:2px solid currentColor;\">\n      <span style=\"display:inline-block;background:{{ c.ink }};color:{{ c.bg }};padding:4px 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;\">(Contact)<\u002Fspan>\n      <h1 style=\"font-family:'Archivo Black',sans-serif;font-size:clamp(40px,7vw,88px);margin:16px 0 0 0;\">Let's talk<\u002Fh1>\n      <p style=\"max-width:620px;font-size:19px;color:{{ c.muted }};margin-top:24px;\">Tell us about your project. We typically reply within one business day.<\u002Fp>\n    <\u002Fsection>\n    <section style=\"padding:clamp(48px,10vw,80px) clamp(16px,4vw,40px) clamp(72px,14vw,140px);display:flex;gap:60px;flex-wrap:wrap;\">\n      <div style=\"flex:1.4;min-width:320px;\">\n        <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:flex;flex-direction:column;gap:20px;\">\n            <div>\n              <label style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;\">Name<\u002Flabel>\n              <input type=\"text\" value=\"{{ form.name }}\" sc-camel-on-change=\"{{ onChangeName }}\" placeholder=\"Your name\" style=\"display:block;width:100%;padding:14px 16px;border:2px solid currentColor;background:transparent;font-size:15px;font-family:inherit;color:inherit;margin-top:8px;outline:none;box-sizing:border-box;\" required=\"{{ true }}\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;\">Email<\u002Flabel>\n              <input type=\"email\" value=\"{{ form.email }}\" sc-camel-on-change=\"{{ onChangeEmail }}\" placeholder=\"you@company.com\" style=\"display:block;width:100%;padding:14px 16px;border:2px solid currentColor;background:transparent;font-size:15px;font-family:inherit;color:inherit;margin-top:8px;outline:none;box-sizing:border-box;\" required=\"{{ true }}\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;\">Company (optional)<\u002Flabel>\n              <input type=\"text\" value=\"{{ form.company }}\" sc-camel-on-change=\"{{ onChangeCompany }}\" placeholder=\"Company name\" style=\"display:block;width:100%;padding:14px 16px;border:2px solid currentColor;background:transparent;font-size:15px;font-family:inherit;color:inherit;margin-top:8px;outline:none;box-sizing:border-box;\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;\">Project type<\u002Flabel>\n              <sc-raw-select value=\"{{ form.projectType }}\" sc-camel-on-change=\"{{ onChangeProjectType }}\" style=\"display:block;width:100%;padding:14px 16px;border:2px solid currentColor;background:transparent;font-size:15px;font-family:inherit;color:inherit;margin-top:8px;outline:none;box-sizing:border-box;\">\n                <sc-for list=\"{{ projectTypeOptions }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                  <option value=\"{{ opt }}\">{{ opt }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div>\n              <label style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;\">Message<\u002Flabel>\n              <textarea value=\"{{ form.message }}\" sc-camel-on-change=\"{{ onChangeMessage }}\" placeholder=\"Tell us a bit about the project\" rows=\"5\" style=\"display:block;width:100%;padding:14px 16px;border:2px solid currentColor;background:transparent;font-size:15px;font-family:inherit;color:inherit;margin-top:8px;outline:none;box-sizing:border-box;resize:vertical;\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <button type=\"submit\" style=\"margin-top:8px;width:fit-content;background:{{ c.ink }};color:{{ c.bg }};padding:16px 28px;border:none;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;\" style-hover=\"background:#D8FF3E;color:#111111;\">Send message<\u002Fbutton>\n          <\u002Fform>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:40px;border:2px solid currentColor;\">\n            <h3 style=\"font-family:'Archivo Black',sans-serif;font-size:28px;margin:0;\">Thanks — message sent.<\u002Fh3>\n            <p style=\"margin-top:12px;font-size:16px;color:{{ c.muted }};\">We'll get back to you within one business day.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:260px;\">\n        <h3 style=\"font-weight:800;font-size:20px;margin:0;\">Get in touch<\u002Fh3>\n        <div style=\"margin-top:24px;\">\n          <span style=\"font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:{{ c.muted2 }};\">Email<\u002Fspan>\n          <div style=\"margin-top:6px;font-size:16px;font-weight:600;\">designagency@gmail.com<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:24px;padding-top:16px;border-top:1px solid {{ c.border }};\">\n          <span style=\"font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:{{ c.muted2 }};\">Based<\u002Fspan>\n          <div style=\"margin-top:6px;font-size:16px;font-weight:600;\">Remote&nbsp; working with clients worldwide.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:24px;padding-top:16px;border-top:1px solid {{ c.border }};\">\n          <span style=\"font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:{{ c.muted2 }};\">Follow<\u002Fspan>\n          <div style=\"display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;\">\n            <span style=\"font-size:15px;font-weight:600;border-bottom:1px solid currentColor;cursor:pointer;\">Instagram<\u002Fspan>\n            <span style=\"font-size:15px;font-weight:600;border-bottom:1px solid currentColor;cursor:pointer;\">LinkedIn<\u002Fspan>\n            <span style=\"font-size:15px;font-weight:600;border-bottom:1px solid currentColor;cursor:pointer;\">X<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <footer style=\"background:{{ c.invBg }};color:{{ c.invText }};padding:clamp(40px,8vw,60px) clamp(16px,4vw,40px) 32px;transition:background 0.3s ease,color 0.3s ease;\">\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:40px;\">\n      <div style=\"max-width:240px;\">\n        <div style=\"font-family:'Archivo Black',sans-serif;font-size:22px;letter-spacing:-0.02em;text-transform:uppercase;\">DESIGN AGENCY<\u002Fdiv>\n        <p style=\"margin-top:12px;font-size:14px;color:{{ c.invMuted }};\">UI/UX, web design, and branding.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ item.onClick }}\" style=\"background:none;border:none;padding:0;color:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left;\">{{ item.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:14px;color:{{ c.invMuted }};\">\n        <div>hello@designagency.com<\u002Fdiv>\n        <div style=\"margin-top:10px;\">Based remotely — worldwide.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px;color:{{ c.invMuted }};\">\n        <span>Instagram<\u002Fspan><span>LinkedIn<\u002Fspan><span>X<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:48px;padding-top:24px;border-top:1px solid {{ c.invBorder }};display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:13px;color:{{ c.invMuted }};\">\n      <span>© {{ year }} DESIGN Agency. All rights reserved.<\u002Fspan>\n      <span>Built with care.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    page: 'home',\n    mode: 'light',\n    workCategory: 'Web Design',\n    submitted: false,\n    isMobile: typeof window !== 'undefined' && window.innerWidth <= 860,\n    menuOpen: false,\n    form: { name: '', email: '', company: '', projectType: 'UI/UX Design', message: '' }\n  };\n\n  componentDidMount() {\n    this.onResize = () => this.setState({ isMobile: window.innerWidth <= 860 });\n    window.addEventListener('resize', this.onResize);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n  }\n\n  navIds = [\n    { id: 'home', label: 'Home' },\n    { id: 'work', label: 'Work' },\n    { id: 'contact', label: 'Contact' }\n  ];\n\n  services = [\n    { id: 'ui-ux', num: '01', title: 'UI/UX Design', short: 'We design interfaces that are intuitive to use and hard to forget. From research and flows to polished, production-ready screens.', desc: 'We turn complex problems into interfaces that feel obvious. Every engagement starts with research and ends with screens ready to ship.', bullets: ['User research & flows', 'Wireframes & prototypes', 'Design systems', 'Production-ready UI'] },\n    { id: 'web', num: '02', title: 'Web Design', short: 'Marketing sites and web apps built to convert, load fast, and represent your brand at its best.', desc: 'Websites built to represent your brand and convert visitors into customers \\u2014 fast, responsive, and easy to maintain.', bullets: ['Marketing sites', 'Landing pages', 'Web apps', 'CMS builds'] },\n    { id: 'branding', num: '03', title: 'Branding', short: 'Identity systems \\u2014 logo, type, color, voice \\u2014 that give a company a consistent presence everywhere it shows up.', desc: 'A visual and verbal identity that holds together across every touchpoint, from your homepage to your pitch deck.', bullets: ['Logo & identity', 'Typography & color systems', 'Brand guidelines', 'Naming & voice'] }\n  ];\n\n  projects = [\n    { id: 'northbeam', title: 'Northbeam', meta: 'Web Design \\u2014 2026', category: 'Web Design' },\n    { id: 'alto', title: 'Alto Health', meta: 'UI/UX Design \\u2014 2025', category: 'UI/UX Design' },\n    { id: 'fieldnote', title: 'Fieldnote', meta: 'Branding \\u2014 2025', category: 'Branding' },\n    { id: 'reroute', title: 'Reroute', meta: 'UI/UX Design \\u2014 2024', category: 'UI/UX Design' },\n    { id: 'marlowe', title: 'Marlowe & Co', meta: 'Web Design \\u2014 2024', category: 'Web Design' },\n    { id: 'currents', title: 'Currents', meta: 'Branding \\u2014 2023', category: 'Branding' }\n  ];\n\n  categories = ['Web Design', 'UI/UX Design', 'Branding'];\n\n  principles = [\n    { num: '01', title: 'Senior team, no hand-offs', desc: 'You work directly with the people doing the design, from kickoff to delivery.' },\n    { num: '02', title: 'Design in the open', desc: 'Weekly check-ins and shared files. You see the work as it happens, not just at the end.' },\n    { num: '03', title: 'Built for the next stage', desc: 'We design for where your business is going, not just where it is today.' }\n  ];\n\n  projectTypeOptions = ['UI/UX Design', 'Web Design', 'Branding', 'Not sure yet'];\n\n  palettes = {\n    light: { bg: '#F3F1EC', ink: '#111111', muted: 'rgba(17,17,17,0.72)', muted2: 'rgba(17,17,17,0.55)', border: 'rgba(17,17,17,0.15)', invBg: '#111111', invText: '#F3F1EC', invMuted: 'rgba(243,241,236,0.7)', invBorder: 'rgba(243,241,236,0.15)' },\n    dark: { bg: '#111111', ink: '#F3F1EC', muted: 'rgba(243,241,236,0.72)', muted2: 'rgba(243,241,236,0.55)', border: 'rgba(243,241,236,0.15)', invBg: '#F3F1EC', invText: '#111111', invMuted: 'rgba(17,17,17,0.7)', invBorder: 'rgba(17,17,17,0.15)' }\n  };\n\n  goTo(page) {\n    this.setState({ page, submitted: false, menuOpen: false });\n    if (typeof window !== 'undefined') window.scrollTo(0, 0);\n  }\n\n  toggleMenu() {\n    this.setState(s => ({ menuOpen: !s.menuOpen }));\n  }\n\n  setMode(mode) {\n    this.setState({ mode });\n  }\n\n  setWorkCategory(workCategory) {\n    this.setState({ workCategory });\n  }\n\n  updateForm(field, value) {\n    this.setState(s => ({ form: { ...s.form, [field]: value } }));\n  }\n\n  renderVals() {\n    const page = this.state.page;\n    const c = this.palettes[this.state.mode];\n\n    const navItems = this.navIds.map(n => ({\n      ...n,\n      onClick: () => this.goTo(n.id),\n      style: {\n        padding: '9px 16px',\n        fontSize: '13px',\n        fontWeight: 700,\n        textTransform: 'uppercase',\n        letterSpacing: '0.04em',\n        border: 'none',\n        cursor: 'pointer',\n        background: page === n.id ? c.ink : 'transparent',\n        color: page === n.id ? c.bg : c.ink,\n        fontFamily: 'Archivo, sans-serif'\n      },\n      mobileStyle: {\n        padding: '12px 4px',\n        fontSize: '17px',\n        fontWeight: 700,\n        textAlign: 'left',\n        textTransform: 'uppercase',\n        letterSpacing: '0.02em',\n        border: 'none',\n        cursor: 'pointer',\n        background: 'transparent',\n        color: page === n.id ? c.ink : c.muted,\n        fontFamily: 'Archivo, sans-serif'\n      }\n    }));\n\n    const modeItems = ['light', 'dark'].map(m => ({\n      id: m,\n      label: m === 'light' ? 'Light' : 'Dark',\n      onClick: () => this.setMode(m),\n      style: {\n        padding: '8px 14px',\n        fontSize: '12px',\n        fontWeight: 700,\n        textTransform: 'uppercase',\n        letterSpacing: '0.04em',\n        border: 'none',\n        cursor: 'pointer',\n        background: this.state.mode === m ? c.ink : 'transparent',\n        color: this.state.mode === m ? c.bg : c.ink,\n        fontFamily: 'Archivo, sans-serif'\n      }\n    }));\n\n    const categoryItems = this.categories.map(cat => ({\n      id: cat,\n      label: cat,\n      onClick: () => this.setWorkCategory(cat),\n      style: {\n        padding: '10px 18px',\n        fontSize: '13px',\n        fontWeight: 700,\n        textTransform: 'uppercase',\n        letterSpacing: '0.03em',\n        border: '2px solid currentColor',\n        cursor: 'pointer',\n        background: this.state.workCategory === cat ? c.ink : 'transparent',\n        color: this.state.workCategory === cat ? c.bg : c.ink,\n        fontFamily: 'Archivo, sans-serif'\n      }\n    }));\n\n    return {\n      c,\n      isHome: page === 'home',\n      isWork: page === 'work',\n      isContact: page === 'contact',\n      isDesktopNav: !this.state.isMobile,\n      isMobileNav: this.state.isMobile,\n      numRowStyle: {\n        display: 'flex',\n        flexDirection: this.state.isMobile ? 'column' : 'row',\n        alignItems: this.state.isMobile ? 'flex-start' : 'center',\n        gap: this.state.isMobile ? '12px' : '40px',\n        width: '100%',\n        maxWidth: '420px',\n        flexShrink: 0\n      },\n      numRowStyle2: {\n        display: 'flex',\n        flexDirection: this.state.isMobile ? 'column' : 'row',\n        alignItems: 'flex-start',\n        gap: this.state.isMobile ? '8px' : '40px'\n      },\n      showMobileMenu: this.state.isMobile && this.state.menuOpen,\n      toggleMenu: () => this.toggleMenu(),\n      navItems,\n      modeItems,\n      categoryItems,\n      toHome: () => this.goTo('home'),\n      toWork: () => this.goTo('work'),\n      toContact: () => this.goTo('contact'),\n      services: this.services,\n      featuredProjects: this.projects.slice(0, 3),\n      allProjects: this.projects,\n      workProjects: this.projects.filter(p => p.category === this.state.workCategory),\n      principles: this.principles,\n      projectTypeOptions: this.projectTypeOptions,\n      form: this.state.form,\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      onChangeName: e => this.updateForm('name', e.target.value),\n      onChangeEmail: e => this.updateForm('email', e.target.value),\n      onChangeCompany: e => this.updateForm('company', e.target.value),\n      onChangeProjectType: e => this.updateForm('projectType', e.target.value),\n      onChangeMessage: e => this.updateForm('message', e.target.value),\n      onSubmit: e => { e.preventDefault(); this.setState({ submitted: true }); },\n      year: new Date().getFullYear()\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
